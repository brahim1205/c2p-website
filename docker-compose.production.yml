services:
  reverse-proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    # Par défaut c2p publie 80/443. Derrière le proxy frontal partagé du serveur (/opt/edge),
    # ops/env/compose.production.env fixe C2P_HTTP_PUBLISH=127.0.0.1:8880 et
    # C2P_HTTPS_PUBLISH=127.0.0.1:8843 : le trafic public arrive alors par le réseau `edge`.
    ports:
      - "${C2P_HTTP_PUBLISH:-80}:8080"
      - "${C2P_HTTPS_PUBLISH:-443}:8443"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ops/nginx/certs:/etc/nginx/certs:ro
      - ./ops/certbot/www:/var/www/certbot:ro
    networks:
      edge:
      app:
      shared-edge:
        aliases:
          - c2p-proxy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=1777

  frontend:
    build:
      context: ./front
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    networks:
      - app
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=1777

  backend:
    build:
      context: ./backend
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ${BACKEND_ENV_FILE:-./ops/env/backend.production.env}
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app
      - monitoring
      - egress
    dns:
      - ${BACKEND_DNS_PRIMARY:-153.92.2.6}
      - ${BACKEND_DNS_SECONDARY:-1.1.1.1}
    read_only: true
    tmpfs:
      - /tmp
      - /usr/src/app/storage/uploads/_tmp:uid=1000,gid=1000,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend-migrate:
    build:
      context: ./backend
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${BACKEND_ENV_FILE:-./ops/env/backend.production.env}
    restart: "no"
    networks:
      - app
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    restart: unless-stopped
    expose:
      - "5432"
    networks:
      - app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    user: "999:1000"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    restart: unless-stopped
    expose:
      - "6379"
    networks:
      - app
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - redis-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  prometheus:
    image: prom/prometheus:v3.4.2
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./ops/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./ops/monitoring/prometheus/secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    expose:
      - "9090"
    networks:
      - monitoring
      - host-access
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./ops/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./ops/monitoring/prometheus/secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped
    expose:
      - "9093"
    networks:
      - monitoring
      - host-access
    ports:
      - "127.0.0.1:9093:9093"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - "--path.rootfs=/host"
    pid: host
    restart: unless-stopped
    volumes:
      - "/:/host:ro,rslave"
    expose:
      - "9100"
    networks:
      - monitoring

networks:
  edge:
  # Réseau du proxy frontal partagé du serveur (créé par ops/scripts/deploy-production.sh s'il manque).
  shared-edge:
    external: true
    name: edge
  app:
    internal: true
  monitoring:
    internal: true
  egress:
  host-access:

volumes:
  prometheus-data:
  alertmanager-data:
  postgres-data:
  redis-data:
