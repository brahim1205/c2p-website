name: monorepo-ci

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      PORT: 3003
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      APP_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      COOKIE_SECURE: "false"
      TRUST_PROXY: "false"
      REDIS_DISABLED: "true"
      METRICS_AUTH_TOKEN: local-metrics-token
      FRONT_URL: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:3003/api
      VITE_API_URL: http://127.0.0.1:3003/api
      VITE_DEV_BACKEND_URL: http://127.0.0.1:3003
      LOGIN_RATE_LIMIT_MAX: "300"
      AUTH_RATE_LIMIT_MAX: "300"
      GLOBAL_RATE_LIMIT_MAX: "1200"
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            front/package-lock.json

      - name: Secret hygiene
        run: |
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '(\.example|\.sample|\.template)$' || true)"
          if [ -n "$tracked_env_files" ]; then
            echo "Tracked sensitive env file detected:"
            printf '%s\n' "$tracked_env_files"
            exit 1
          fi

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: front
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: front
        run: npx playwright install --with-deps chromium

      - name: Backend dependency audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend dependency audit
        working-directory: front
        run: npm audit --omit=dev --audit-level=high

      - name: Architecture guard
        run: node ops/scripts/architecture-check.mjs

      - name: CI governance guard
        run: node ops/scripts/ci-governance-check.mjs

      - name: Production runtime guard
        working-directory: backend
        run: npm run production:runtime:check

      - name: Production compose guard
        working-directory: backend
        run: npm run production:compose:check -- --compose-env ops/env/compose.production.env.example

      - name: Production ops script syntax
        run: |
          bash -n ops/scripts/deploy-production.sh
          bash -n ops/scripts/rollback-production.sh
          bash -n ops/scripts/postgres-backup.sh
          bash -n ops/scripts/postgres-restore.sh
          node --check ops/scripts/postgres-backup-check.mjs
          node --check ops/scripts/postgres-restore-drill.mjs
          node --check ops/scripts/prepare-production-env.mjs
          node --check ops/scripts/production-env-set.mjs
          node --check ops/scripts/production-env-status.mjs
          node --check ops/scripts/production-external-providers-check.mjs
          node --check ops/scripts/production-readiness-report.mjs
          node --check ops/scripts/production-postdeploy-check.mjs
          node --check front/scripts/state-boundary-check.mjs
          node --check front/scripts/form-coherence.mjs

      - name: Production postdeploy static guard
        working-directory: backend
        run: >
          npm run production:postdeploy --
          --skip-compose-ps
          --skip-http
          --skip-monitoring
          --skip-upload-metadata-audit
          --skip-upload-temp-cleanup
          --skip-backup-check

      - name: Validate Prisma schema
        working-directory: backend
        run: npm run prisma:validate

      - name: Prepare PostgreSQL schema
        working-directory: backend
        run: npx prisma db push --skip-generate

      - name: Apply database hardening checks
        working-directory: backend
        run: npm run db:ledger-immutability:local

      - name: Seed PostgreSQL with platform data
        working-directory: backend
        run: npm run db:seed:local

      - name: Check Marketplace Prisma projection
        working-directory: backend
        run: npm run marketplace:prisma-consistency:check

      - name: Check PostgreSQL connection
        working-directory: backend
        run: npm run db:check

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Lint frontend
        working-directory: front
        run: npm run lint

      - name: Frontend state boundary guard
        working-directory: front
        run: npm run state:check

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Backend legacy data mode checks
        working-directory: backend
        run: npm run data:legacy-mode:test

      - name: Type-check frontend
        working-directory: front
        run: npm run type-check

      - name: Build frontend
        working-directory: front
        env:
          NODE_ENV: production
        run: npm run build

      - name: Frontend bundle budget
        working-directory: front
        env:
          NODE_ENV: production
        run: npm run bundle:budget

      - name: Build backend image
        run: docker build --pull -t c2p-backend:ci ./backend

      - name: Build frontend image
        run: docker build --pull -t c2p-frontend:ci ./front

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy backend image scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: c2p-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy frontend image scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: c2p-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Start backend
        working-directory: backend
        run: |
          nohup npm run start > /tmp/c2p-backend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3003/api/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/c2p-backend.log
          exit 1

      - name: Start frontend preview
        working-directory: front
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 3000 > /tmp/c2p-front.log 2>&1 &

      - name: Wait for frontend
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/c2p-front.log
          exit 1

      - name: Backend security checks
        working-directory: backend
        run: npm run security:test

      - name: Backend finance domain checks
        working-directory: backend
        run: npm run finance:validate

      - name: Backend upload policy checks
        working-directory: backend
        run: npm run uploads:validate

      - name: Backend email provider checks
        working-directory: backend
        run: npm run email:provider:check

      - name: Swagger contract check
        working-directory: backend
        run: npm run swagger:check

      - name: Backend API flow checks
        working-directory: backend
        run: npm run http:checks

      - name: Frontend smoke test
        working-directory: front
        run: npm run smoke:test

      - name: Frontend form-display coherence test
        working-directory: front
        run: npm run smoke:test:forms

      - name: Print service logs on failure
        if: failure()
        run: |
          echo "===== backend ====="
          cat /tmp/c2p-backend.log || true
          echo "===== frontend ====="
          cat /tmp/c2p-front.log || true
