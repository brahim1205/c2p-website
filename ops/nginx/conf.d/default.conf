map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream c2p_frontend {
  server frontend:8080;
}

upstream c2p_backend {
  server backend:3000;
}

upstream c2p_sonarqube {
  server sonarqube:9000;
}

server {
  listen 8080;
  server_name c2p.sn www.c2p.sn;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location / {
    return 301 https://c2p.sn$request_uri;
  }
}

server {
  listen 8080;
  server_name sonar.c2p.sn;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location / {
    return 301 https://sonar.c2p.sn$request_uri;
  }
}

server {
  listen 8443 ssl http2;
  server_name www.c2p.sn;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  return 301 https://c2p.sn$request_uri;
}

server {
  listen 8443 ssl http2;
  server_name c2p.sn;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-site" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://www.google.com https://maps.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://www.google.com; media-src 'self' blob:; form-action 'self'; upgrade-insecure-requests" always;

  client_max_body_size 5g;

  location /api/metrics {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://c2p_backend/api/metrics;
    include /etc/nginx/conf.d/proxy_params.conf;
  }

  location /api/uploads/ {
    proxy_pass http://c2p_backend/api/uploads/;
    proxy_request_buffering off;
    proxy_buffering off;
    include /etc/nginx/conf.d/proxy_params.conf;
  }

  location /api/ {
    proxy_pass http://c2p_backend/api/;
    include /etc/nginx/conf.d/proxy_params.conf;
  }

  location /uploads/ {
    proxy_pass http://c2p_backend/uploads/;
    include /etc/nginx/conf.d/proxy_params.conf;
  }

  location / {
    proxy_pass http://c2p_frontend/;
    include /etc/nginx/conf.d/proxy_params.conf;
  }
}

server {
  listen 8443 ssl http2;
  server_name sonar.c2p.sn;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 200m;

  location / {
    proxy_pass http://c2p_sonarqube/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}
