sonar.projectKey=c2p
sonar.projectName=C2P Platform
sonar.projectVersion=2.0.0

sonar.sources=backend/src,backend/scripts,ops/scripts,front/src,front/scripts
sonar.tests=
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,front/coverage/lcov.info
sonar.typescript.tsconfigPaths=backend/tsconfig.json,front/tsconfig.app.json

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/out/**,\
  **/.next/**,\
  **/coverage/**,\
  **/storage/uploads/**,\
  **/.env,\
  **/.env.*,\
  **/*.env,\
  **/*.env.*,\
  **/prisma/migrations/**,\
  **/*.tsbuildinfo,\
  **/mock-store-seed/**,\
  **/mock-store.seed.ts

sonar.coverage.exclusions=\
  **/*.config.*,\
  **/*.dto.ts,\
  **/*.types.ts,\
  **/*.d.ts,\
  **/scripts/**,\
  **/mock-store-seed/**,\
  **/mock-store.seed.ts

sonar.cpd.exclusions=\
  **/prisma/migrations/**,\
  **/mock-store-seed/**,\
  **/mock-store.seed.ts
