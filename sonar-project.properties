sonar.organization=brahim1205
sonar.projectKey=brahim1205_c2p-website
sonar.projectName=C2P Platform
sonar.projectVersion=2.0.0

sonar.sources=backend/src,front/src
sonar.tests=
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,front/coverage/lcov.info
sonar.typescript.tsconfigPaths=backend/tsconfig.json,front/tsconfig.app.json

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/out/**,\
  **/.next/**,\
  **/coverage/**,\
  **/storage/uploads/**,\
  **/.env,\
  **/.env.*,\
  **/*.env,\
  **/*.env.*,\
  **/prisma/migrations/**,\
  **/scripts/**,\
  **/*.cli.ts,\
  **/.github/**,\
  android/**,\
  ios/**,\
  **/*.tsbuildinfo,\
  **/mock-store-seed/**,\
  **/mock-store.seed.ts

sonar.coverage.exclusions=\
  **/*.config.*,\
  **/*.dto.ts,\
  **/*.types.ts,\
  **/*.d.ts,\
  **/scripts/**,\
  **/mock-store-seed/**,\
  **/mock-store.seed.ts

sonar.cpd.exclusions=\
  **/prisma/migrations/**,\
  **/scripts/**,\
  **/*.cli.ts,\
  **/.github/**,\
  **/mock-store-seed/**,\
  **/mock-store.seed.ts

sonar.issue.ignore.multicriteria=regex-normalizers
sonar.issue.ignore.multicriteria.regex-normalizers.ruleKey=typescript:S5852
sonar.issue.ignore.multicriteria.regex-normalizers.resourceKey=**/src/**
